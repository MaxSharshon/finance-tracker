services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finance-tracker-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD}
    ports:
      - "${SQL_SERVER_PORT}:1433"
    volumes:
      - finance-tracker-sql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: FinanceTracker.API/Dockerfile
    container_name: finance-tracker-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__LocalFinanceTrackerDb: "Server=sqlserver,1433;Database=${SQL_SERVER_DATABASE};User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;"
      Database__ApplyMigrations: ${APPLY_MIGRATIONS}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_IN_MINUTES}
    ports:
      - "${API_PORT}:8080"

  ui:
    build:
      context: .
      dockerfile: FinanceTracker.UI/Dockerfile
    container_name: finance-tracker-ui
    depends_on:
      - api
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ApiSettings__LocalBaseAddress: ${UI_API_BASE_ADDRESS}
    ports:
      - "${UI_PORT}:8080"

volumes:
  finance-tracker-sql-data:
